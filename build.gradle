plugins {
    id 'java-library'
    id 'maven-publish'
    // 26.x is unobfuscated: the non-remapping Loom plugin, no mappings dependency
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${minecraft_version}-${mod_version}"
group = mod_group
base.archivesName = "${mod_name}-FABRIC"

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Keep build output out of OneDrive (it locks files while syncing)
def buildRoot = "${System.getProperty('user.home')}/.gradle-builds/${project.name}-fabric"
layout.buildDirectory = file(buildRoot)

loom {
    splitEnvironmentSourceSets()

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        configureEach {
            runDir = project.relativePath(file("${buildRoot}/run"))
        }
        client {
            // -Pquickplay=<world> loads straight into a singleplayer world (automated smoke tests)
            if (project.hasProperty('quickplay')) {
                programArgs '--quickPlaySingleplayer', project.property('quickplay').toString()
            }
        }
        server {
            programArgs '--nogui'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // BananaUtil (Fabric build)
    implementation files("${System.getProperty('user.home')}/.gradle-builds/releases/fabric-${minecraft_version}/BananaUtil-FABRIC-${bananautil_version}.jar")
    // -PwithMorph: also run Morphing Time in the dev client (to test the integration)
    if (project.hasProperty('withMorph')) {
        runtimeOnly files(project.property('withMorph').toString())
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_display_name: mod_display_name, mod_version: mod_version, loader_version: loader_version, minecraft_dep: minecraft_dep]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : 'magicbanana666',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : 'magicbanana666'
        ])
    }
}
